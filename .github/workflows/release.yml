name: Release binaries

# Builds release archives and uploads them, with checksums.txt, to an existing
# draft release. It never creates, publishes or edits the release itself.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pushed tag (vMAJOR.MINOR.PATCH) with a draft release, on a commit already merged to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Require a pushed tag merged to main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist. Push the tag before creating the draft release (see RELEASING.md)."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "Tag ${TAG} is not on main."
            exit 1
          fi
      - name: Check out the tagged commit
        env:
          TAG: ${{ inputs.tag }}
        run: git checkout --detach "refs/tags/${TAG}"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Draft releases are only visible to tokens with write access, so this check
  # runs in its own job that does not check out or execute repository code.
  require-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          is_draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft || true)"
          if [ "$is_draft" != "true" ]; then
            echo "Create a draft release for ${TAG} first (see RELEASING.md)."
            exit 1
          fi

  build:
    needs: [validate, require-draft]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          mkdir -p dist stage
          name="restore-evidence_${TAG}_${GOOS}_${GOARCH}"
          binary="restore-evidence"
          if [ "$GOOS" = "windows" ]; then
            binary="${binary}.exe"
          fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X main.version=${TAG}" -o "stage/${binary}" ./cmd/restore-evidence
          cp LICENSE NOTICE README.md stage/
          cp "$(go env GOROOT)/LICENSE" stage/LICENSE-go
          # Fixed timestamps and ordering make the archives reproducible.
          touch -d "@$(git log -1 --format=%ct)" stage/*
          if [ "$GOOS" = "windows" ]; then
            (cd stage && TZ=UTC zip -X -q "../dist/${name}.zip" "$binary" LICENSE LICENSE-go NOTICE README.md)
          else
            tar -C stage --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
              -cf - "$binary" LICENSE LICENSE-go NOTICE README.md | gzip -n > "dist/${name}.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          cd dist
          sha256sum *.tar.gz *.zip | sort -k2 > checksums.txt
          cat checksums.txt
          is_draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Refusing to upload assets to a published release."
            exit 1
          fi
          gh release upload "$TAG" --repo "$GH_REPO" --clobber *.tar.gz *.zip checksums.txt
